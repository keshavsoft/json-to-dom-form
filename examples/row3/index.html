<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Search & Table | JSON to DOM (v8)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://keshavsoft.github.io/json-to-dom/dist/v13/min.js" type="module"></script>

    <style>
        .text-small {
            font-size: 0.85rem;
        }

        .nav-link {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .nav-link:hover {
            color: #0dcaf0 !important;
        }

        .nav-link.active {
            color: #0d6efd !important;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 36px;
            background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 1.25rem;
            text-decoration: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 991.98px) {
            .navbar-collapse {
                background: #212529;
                padding: 1rem 0.5rem;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                margin-top: 0.5rem;
                border-radius: 8px;
            }

            .navbar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 0.5rem;
            }

            .navbar-nav .nav-item {
                min-width: 70px;
            }
        }

        /* Active/clicked filter row highlight */
        .filter-row-active {
            background-color: rgba(13, 110, 253, 0.08);
            border-radius: 6px;
            outline: 1.5px solid rgba(13, 110, 253, 0.35);
            transition: background-color 0.2s ease, outline 0.2s ease;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Dynamic Header & Menu rendered by json-to-dom-menu -->
    <div id="header-container"></div>

    <div id="form-container"></div>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script type="module" src="./index.js"></script>
</body>

</html>
