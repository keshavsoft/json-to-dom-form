<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App shell · json-to-dom-form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: #edf2f7;
        font-family: Inter, Arial, sans-serif;
      }
      .app-shell {
        min-height: 100vh;
        background: linear-gradient(180deg, #f8fafc, #eef2ff);
      }
      .sidebar {
        background: #0f172a;
        color: #e2e8f0;
      }
      .nav-item { color: #cbd5e1; }
      .nav-item.active {
        background: rgba(96,165,250,0.18);
        color: white;
      }
      .content-panel {
        background: white;
        border-radius: 20px;
        border: 1px solid rgba(148,163,184,0.2);
        box-shadow: 0 16px 40px rgba(15,23,42,.08);
      }
      .header-bar {
        background: #ffffff;
        border-bottom: 1px solid rgba(148,163,184,.18);
      }
      .theme-pill { background: #dbeafe; color: #1d4ed8; }
      .form-wrap { min-height: 240px; }
      .info-box {
        background: #f8fafc;
        border: 1px solid rgba(148,163,184,.18);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 18px;
      }
      .chip {
        display: inline-block;
        font-size: 11px;
        letter-spacing: .06em;
        text-transform: uppercase;
        border-radius: 999px;
        background: #e2e8f0;
        color: #334155;
        padding: 6px 10px;
        margin-right: 8px;
        margin-bottom: 8px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="container-fluid p-0 h-100">
        <div class="row g-0 min-vh-100">
          <aside class="sidebar col-lg-2 p-4">
            <div class="d-flex align-items-center gap-2 mb-4">
              <div class="rounded-circle bg-primary bg-opacity-10 px-2 py-1 text-primary fw-bold">J</div>
              <strong>App Shell</strong>
            </div>
            <div class="nav flex-column gap-2">
              <div class="nav-item rounded px-3 py-2">Settings</div>
            </div>
          </aside>

          <main class="col-lg-10 p-4">
            <div class="header-bar rounded-pill px-4 py-3 mb-4 d-flex justify-content-between align-items-center">
              <div>
                <small class="text-uppercase text-muted">Operations</small>
                <div class="fw-bold">Stock Item Maintenance</div>
              </div>
              <span class="theme-pill badge rounded-pill px-3 py-2">Bootstrap view</span>
            </div>

            <div class="info-box">
              <span class="chip">Full app</span>
              <span class="chip">Dashboard shell</span>
              <span class="chip">Product workflow</span>
              <div class="mono mt-3">layout: "grid-2col"<br />body: { columns: ["stockItemName", "batchName", "rate", "branchName", "remarks"] }</div>
            </div>

            <div class="content-panel p-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                  <h3 class="mb-1">Item details</h3>
                  <small class="text-muted">Metadata-driven form in app layout</small>
                </div>
                <button class="btn btn-primary btn-sm">Apply</button>
              </div>
              <div id="bootstrap-demo" class="form-wrap"></div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script type="module" src="../shared.js"></script>
    <script type="module">
      import { renderExample } from "../shared.js";

      const appExample = {
        title: "Bootstrap shell form",
        data: {
          stockItemName: "ROPE",
          batchName: "Tuf-Rs.170",
          rate: "259.26",
          branchName: "Main Branch",
          remarks: "Priority for dispatch"
        },
        columns: [
          { key: "stockItemName", label: "Stock item", type: "string" },
          { key: "batchName", label: "Batch name", type: "string" },
          { key: "rate", label: "Rate", type: "number" },
          { key: "branchName", label: "Branch", type: "string" },
          { key: "remarks", label: "Remarks", type: "string" }
        ],
        config: {
          layout: "grid-2col",
          body: { columns: ["stockItemName", "batchName", "rate", "branchName", "remarks"] }
        },
        theme: "light"
      };

      await renderExample({ targetId: "bootstrap-demo", definition: appExample });
    </script>
  </body>
</html>
