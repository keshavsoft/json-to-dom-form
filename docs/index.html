<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>json-to-dom-form | Standalone Demo</title>
    <!-- Fonts & Bootstrap 5 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
        }

        .top-nav {
            height: 44px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
        }

        .panel-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
        }

        .console-box {
            background: #0f172a;
            color: #38bdf8;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            height: 380px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <header class="top-nav">
        <div class="d-flex align-items-center gap-2">
            <span class="fw-bold text-dark small">json-to-dom-form</span>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-0.5 font-monospace" style="font-size: 11px;">Standalone</span>
        </div>
        <a href="../../json-to-dom-renderers/docs/index.html" class="btn btn-sm btn-outline-secondary py-1 px-2.5 d-flex align-items-center gap-1" style="font-size: 12px;">
            <i class="bi bi-arrow-left"></i> Home
        </a>
    </header>

    <main class="container-fluid px-3 py-2">
        <div class="row g-2">
            <div class="col-lg-6">
                <div class="panel-box">
                    <div class="d-flex justify-content-between align-items-center mb-3 pb-1 border-bottom">
                        <span class="fw-bold small text-dark"><i class="bi bi-ui-checks me-1 text-primary"></i>Config-Driven Form</span>
                        <div class="d-flex align-items-center gap-1">
                            <label for="theme-select" class="small text-muted fw-semibold">Theme:</label>
                            <select id="theme-select" class="form-select form-select-sm" style="width: 105px;">
                                <option value="default" selected>Default</option>
                                <option value="light">Light</option>
                                <option value="dark">Dark</option>
                            </select>
                        </div>
                    </div>
                    <div id="form-container"></div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="console-box" id="form-console">
                    <div class="text-secondary pb-1 mb-2 border-bottom border-secondary">// Form Events & Input Data Log</div>
                    <pre class="m-0 text-info" id="log-content">Click any Search/Submit button in the rendered form...</pre>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { sampleColumns, sampleSearchConfig } from "./sampleData.js";
        import { Form } from "./dist/v1/min.js";

        // Guaranteed self-contained json-to-dom engine
        if (!window.ks?.["json-to-dom"]?.buildSpecElement) {
            const isNullOrUndefined = ({ inSpec }) => !inSpec;
            const isDOMNode = ({ inSpec }) => inSpec instanceof Node;
            const isArray = ({ inSpec }) => Array.isArray(inSpec);
            const isObject = ({ inSpec }) => typeof inSpec === "object" && !!inSpec;
            const handleArray = ({ inSpec }) => inSpec.map(item => buildSpecElement(item)).flat().filter(Boolean);
            const createElement = ({ inTagName }) => document.createElement(inTagName);
            const applyTextContent = ({ inElement, inTextContent }) => {
                if (inTextContent) inElement.textContent = inTextContent;
                return inElement;
            };
            const applyProperties = ({ inElement, inProperties }) => {
                if (inProperties) Object.assign(inElement, inProperties);
                return inElement;
            };
            const applyAttributes = ({ inElement, inAttributes }) => {
                if (inAttributes) {
                    Object.entries(inAttributes).forEach(([key, val]) => {
                        if (key === "class") inElement.className = val;
                        else inElement.setAttribute(key, val);
                    });
                }
                return inElement;
            };
            const applyClassList = ({ inElement, inClassList }) => {
                if (inClassList) {
                    if (Array.isArray(inClassList)) inClassList.forEach(c => c && inElement.classList.add(c));
                    else if (typeof inClassList === "string") inClassList.split(" ").forEach(c => c && inElement.classList.add(c));
                }
                return inElement;
            };
            const applyEvents = ({ inElement, inEvents, inTagName }) => {
                if (inEvents && typeof inEvents === "object") {
                    Object.entries(inEvents).forEach(([ev, handler]) => {
                        if (typeof handler === "function") inElement.addEventListener(ev, handler);
                    });
                }
                return inElement;
            };
            const appendChildren = ({ inElement, inChildren }) => {
                if (inChildren && Array.isArray(inChildren)) {
                    inChildren.forEach(ch => {
                        const node = buildSpecElement(ch);
                        if (node) inElement.appendChild(node);
                    });
                }
                return inElement;
            };
            const handleElement = ({ inSpec }) => {
                const el = createElement({ inTagName: inSpec.tagName || "div" });
                applyAttributes({ inElement: el, inAttributes: inSpec.attributes });
                applyClassList({ inElement: el, inClassList: inSpec.classList });
                applyProperties({ inElement: el, inProperties: inSpec.properties });
                applyTextContent({ inElement: el, inTextContent: inSpec.textContent });
                applyEvents({ inElement: el, inEvents: inSpec.events, inTagName: inSpec.tagName });
                appendChildren({ inElement: el, inChildren: inSpec.children });
                return el;
            };
            const buildSpecElement = (specInput) => {
                const spec = specInput && typeof specInput === "object" && "inSpec" in specInput && !(specInput instanceof Node) && !Array.isArray(specInput) ? specInput.inSpec : specInput;
                if (isNullOrUndefined({ inSpec: spec })) return null;
                if (isDOMNode({ inSpec: spec })) return spec;
                if (isArray({ inSpec: spec })) return handleArray({ inSpec: spec });
                if (isObject({ inSpec: spec })) return handleElement({ inSpec: spec });
                return null;
            };
            window.ks = window.ks || {};
            window.ks["json-to-dom"] = { buildSpecElement };
        }

        const form = new Form({
            inColumns: sampleColumns,
            inConfig: sampleSearchConfig,
            inTargetContainerId: "form-container"
        });

        let formResult = form.render();

        const logEntry = ({ inAction, inData } = {}) => {
            const localAction = inAction;
            const localData = inData;
            const logEl = document.getElementById("log-content");
            const time = new Date().toLocaleTimeString();
            logEl.textContent = `[${time}] ${localAction}:\n${JSON.stringify(localData, null, 2)}\n\n` + logEl.textContent;
        };

        const wireButtons = ({ inContainer } = {}) => {
            const localContainer = inContainer;
            if (!localContainer) return;
            const buttons = localContainer.querySelectorAll("button");
            buttons.forEach(button => {
                button.addEventListener("click", (e) => {
                    const row = e.currentTarget.closest("div");
                    const input = row?.querySelector("input");
                    if (!input) return;
                    const fieldName = input.getAttribute("name");
                    const val = input.value;
                    logEntry({ inAction: "Button Clicked", inData: { field: fieldName, value: val } });
                });
            });
        };

        wireButtons({ inContainer: formResult?.element });

        document.getElementById("theme-select")?.addEventListener("change", (e) => {
            formResult = form.setTheme({ inTheme: e.target.value });
            wireButtons({ inContainer: formResult?.element });
        });
    </script>
</body>

</html>
