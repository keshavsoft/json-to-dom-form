<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>json-to-dom-form | Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --panel-border: #e2e8f0;
            --text: #0f172a;
            --muted: #475569;
            --primary: #2563eb;
            --terminal: #0f172a;
            --terminal-text: #bae6fd;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 1.25rem;
            background: #fff;
            border-bottom: 1px solid var(--panel-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.28rem 0.65rem;
            font-size: 0.72rem;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .shell {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 1rem;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1rem;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(248, 250, 252, 0.7);
        }

        .card-body {
            padding: 1rem;
        }

        .terminal {
            background: var(--terminal);
            color: var(--terminal-text);
            font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
            min-height: 360px;
            padding: 1rem;
            border-radius: 0.75rem;
            white-space: pre-wrap;
            word-break: break-word;
            overflow: auto;
        }

        .muted {
            color: var(--muted);
        }

        .note {
            border-left: 3px solid var(--primary);
            padding-left: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.92rem;
            color: var(--muted);
        }

        @media (max-width: 920px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <span>json-to-dom-form</span>
            <span class="badge">metadata-driven forms</span>
        </div>
        <a class="btn btn-outline-secondary btn-sm" href="../README.md">Readme</a>
    </header>

    <main class="shell">
        <div class="note">
            This repository turns a column catalog + config object into a rendered form.
            It is deliberately narrow: it builds forms from data, not full application logic.
        </div>

        <div class="grid">
            <section class="card">
                <div class="card-header">
                    <strong>Live form</strong>
                    <label class="d-flex align-items-center gap-2 mb-0 muted" style="font-size: 0.85rem;">
                        Theme
                        <select id="theme-select" class="form-select form-select-sm" style="width: 110px;">
                            <option value="default" selected>Default</option>
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                        </select>
                    </label>
                </div>
                <div class="card-body">
                    <div id="form-container"></div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <strong>Form output</strong>
                </div>
                <div class="card-body">
                    <div id="log-output" class="terminal">Loading demo...</div>
                </div>
            </section>
        </div>
    </main>

    <script type="module">
        import { Form } from "../src/v4/index.js";
        import { sampleColumns, sampleSearchConfig } from "./sampleData.js";

        if (!window.ks) window.ks = {};
        if (!window.ks["json-to-dom"]) {
            window.ks["json-to-dom"] = {
                buildSpecElement(specInput) {
                    const node = specInput && typeof specInput === "object" && "inSpec" in specInput ? specInput.inSpec : specInput;
                    if (!node) return null;

                    const toArray = value => Array.isArray(value) ? value : [value].filter(Boolean);

                    const build = input => {
                        if (!input) return null;
                        if (input instanceof Node) return input;
                        if (Array.isArray(input)) return input.map(build).flat().filter(Boolean);
                        if (typeof input !== "object") return null;

                        const tagName = input.tagName || "div";
                        const element = document.createElement(tagName);

                        if (input.attributes) {
                            Object.entries(input.attributes).forEach(([key, value]) => {
                                if (key === "class") element.className = value;
                                else element.setAttribute(key, value);
                            });
                        }

                        if (input.classList) {
                            const classes = Array.isArray(input.classList)
                                ? input.classList
                                : String(input.classList).split(" ");
                            classes.filter(Boolean).forEach(cls => element.classList.add(cls));
                        }

                        if (input.properties) Object.assign(element, input.properties);
                        if (input.textContent) element.textContent = input.textContent;

                        if (input.events) {
                            Object.entries(input.events).forEach(([eventName, handler]) => {
                                if (typeof handler === "function") element.addEventListener(eventName, handler);
                            });
                        }

                        toArray(input.children).forEach(child => {
                            const builtChild = build(child);
                            if (builtChild) {
                                if (Array.isArray(builtChild)) builtChild.forEach(chunk => element.appendChild(chunk));
                                else element.appendChild(builtChild);
                            }
                        });

                        return element;
                    };

                    return build(node);
                }
            };
        }

        const form = new Form({
            data: {
                stockItemName: "ROPE",
                batchName: "Tuf-Rs.170",
                amount: "420.00"
            },
            columns: sampleColumns,
            config: sampleSearchConfig,
            targetContainerId: "form-container"
        });

        const logOutput = document.getElementById("log-output");

        const writeLog = (message) => {
            const stamp = new Date().toLocaleTimeString();
            logOutput.textContent = `[${stamp}] ${message}\n\n` + logOutput.textContent;
        };

        const renderForm = async () => {
            const result = await form.render();
            const controls = form.getControlsTree();
            writeLog(`Rendered form. controls=${Array.isArray(controls) ? controls.length : "n/a"}`);
            writeLog(JSON.stringify(form.getData(), null, 2));

            result.element.querySelectorAll("button").forEach(button => {
                button.addEventListener("click", () => {
                    writeLog(`Button click: ${JSON.stringify(form.getData(), null, 2)}`);
                });
            });
        };

        document.getElementById("theme-select").addEventListener("change", (event) => {
            form.setTheme({ inTheme: event.target.value });
            renderForm();
        });

        renderForm();
    </script>
</body>

</html>
